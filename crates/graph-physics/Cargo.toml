[package]
name = "graph-physics"
version = "0.1.0"
edition = "2024"
description = "High-performance SIMD 3D force-directed graph physics engine"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# bytemuck: used for zero-cost cast_slice of Vec<Vec3A> → &[f32].
# The "derive" feature enables Pod/Zeroable derive macros if needed later.
bytemuck = { version = "1.18", features = ["derive"] }
# glam: SIMD-aligned Vec3A (128-bit) matches WASM v128 lane layout exactly.
# "bytemuck" feature enables bytemuck::Pod impl on all glam types.
glam = { version = "0.33", features = ["bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Disable debug assertions and overflow checks in hot paths.
debug-assertions = false
overflow-checks = false
